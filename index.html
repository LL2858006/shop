<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>乐茵珠宝 · 选款</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"PingFang SC",sans-serif; background:#f7f5f2; color:#333; }
  .header { background:linear-gradient(135deg,#8e7cc3,#b99cd8); color:#fff; padding:30px 20px 38px; text-align:center; }
  .header h1 { font-size:20px; letter-spacing:2px; }
  .header p { font-size:12px; opacity:.9; margin-top:6px; }
  .wrap { max-width:520px; margin:-18px auto 0; padding:0 14px 40px; }
  .notice { background:#fff; border-radius:12px; padding:11px 13px; font-size:12.5px; color:#666; box-shadow:0 2px 8px rgba(0,0,0,.04); margin-bottom:14px; line-height:1.7; }
  .notice b { color:#8e7cc3; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  .card { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.05); display:flex; flex-direction:column; }
  .img-wrap { width:100%; aspect-ratio:1; background:#eee url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 24 24" fill="%23bbb"><path d="M8.5 13.5l2.5 3 3.5-4.5 4 5.5H6zM7 9a2 2 0 100 4 2 2 0 000-4z"/></svg>') center/26% no-repeat; position:relative; }
  .img-num { position:absolute; right:6px; bottom:6px; background:rgba(0,0,0,.45); color:#fff; font-size:10px; padding:1px 6px; border-radius:8px; }
  .gallery { position:relative; margin:0 0 6px; border-radius:10px; overflow:hidden; background:#eee; }
  .gallery .g-main { width:100%; aspect-ratio:1; background:#eee center/cover no-repeat; }
  .g-dots { position:absolute; bottom:8px; left:0; right:0; text-align:center; }
  .g-dots span { display:inline-block; width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.65); margin:0 3px; }
  .g-dots span.on { background:#8e7cc3; }
  .g-arrow { position:absolute; top:50%; transform:translateY(-50%); width:28px; height:28px; line-height:26px; border-radius:50%; background:rgba(0,0,0,.35); color:#fff; text-align:center; font-size:16px; border:none; cursor:pointer; }
  .g-arrow.prev { left:8px; }
  .g-arrow.next { right:8px; }
  .g-count { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.45); color:#fff; font-size:11px; padding:2px 7px; border-radius:10px; }
  .info { padding:9px 11px 12px; display:flex; flex-direction:column; gap:5px; flex:1; }
  .name { font-size:13.5px; font-weight:600; line-height:1.4; }
  .spec { font-size:11px; color:#999; }
  .price-row { display:flex; align-items:center; justify-content:space-between; margin-top:auto; }
  .price { color:#d4380d; font-size:15px; font-weight:700; }
  .btn { background:#8e7cc3; color:#fff; border:none; border-radius:8px; padding:8px 13px; font-size:12.5px; font-weight:600; }
  .btn:active { opacity:.85; }
  .foot { margin-top:16px; background:#fff; border-radius:12px; padding:14px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.04); }
  .foot .w { font-size:13px; } .foot .w b { color:#8e7cc3; }
  .foot .t { font-size:11.5px; color:#999; margin-top:3px; }
  .mask { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:10; }
  .drawer { display:none; position:fixed; left:0; right:0; bottom:0; background:#fff; border-radius:16px 16px 0 0; z-index:11; padding:18px 15px 22px; }
  .drawer h3 { font-size:16px; }
  .d-line { font-size:12.5px; color:#666; margin:4px 0 10px; }
  .d-price { font-size:15px; color:#d4380d; font-weight:700; }
  .drawer label { display:block; font-size:12.5px; margin:10px 0 5px; font-weight:600; }
  .drawer input,.drawer textarea { width:100%; border:1px solid #e5e5e5; border-radius:8px; padding:9px 11px; font-size:13.5px; outline:none; }
  .drawer textarea { height:56px; resize:none; }
  .sub { width:100%; margin-top:14px; padding:12px; border:none; border-radius:10px; background:#8e7cc3; color:#fff; font-size:14.5px; font-weight:700; }
  .can { width:100%; margin-top:8px; padding:10px; border:none; border-radius:10px; background:#f0f0f0; color:#666; font-size:13px; }
  .ok { display:none; position:fixed; inset:0; background:#fff; z-index:12; padding:70px 22px; text-align:center; }
  .ok .ic { width:56px; height:56px; line-height:56px; border-radius:50%; background:#52c41a; color:#fff; font-size:28px; margin:0 auto 14px; }
  .ok h2 { font-size:19px; margin-bottom:8px; }
  .ok p { font-size:13px; color:#666; line-height:1.8; }
  .copy { margin:16px auto; padding:9px 22px; border:none; border-radius:10px; background:#8e7cc3; color:#fff; font-size:13.5px; font-weight:600; }
  .ok .box { background:#f7f5f2; border-radius:10px; padding:11px; font-size:12.5px; color:#555; text-align:left; margin-bottom:16px; line-height:1.8; white-space:pre-wrap; word-break:break-all; }
  .back { padding:9px 28px; border:none; border-radius:10px; background:#f0f0f0; color:#666; font-size:13px; }
</style>
</head>
<body>
<div class="header"><h1>乐茵珠宝</h1><p>珍珠 · 水晶手串 ｜ 选中款式后私聊店主下单</p></div>
<div class="wrap">
  <div class="notice"><b>怎么买：</b>点「选这款」→ 选规格、留微信号和地址 → 复制选款单发给店主微信（<b>lelezhubao</b>）→ 店主确认后转账发货。</div>
  <div class="grid" id="grid"></div>
  <div class="foot"><div class="w">店主微信：<b>lelezhubao</b></div><div class="t">加微信备注「手串」，店主会尽快回复</div></div>
</div>
<div class="mask" id="mask"></div>
<div class="drawer" id="drawer">
  <div class="gallery" id="gallery" style="display:none;">
    <div class="g-main" id="gMain"></div>
    <button class="g-arrow prev" onclick="gPrev()">‹</button>
    <button class="g-arrow next" onclick="gNext()">›</button>
    <div class="g-dots" id="gDots"></div>
    <div class="g-count" id="gCount"></div>
  </div>
  <h3 id="dName"></h3><div class="d-line" id="dSpec"></div><div class="d-price" id="dPrice"></div>
  <label>规格 / 尺寸</label><input id="fSpec" placeholder="例：14cm 手围 / 8mm 珠径">
  <label>你的微信号 或 手机号（必填）</label><input id="fContact" placeholder="方便店主联系你">
  <label>收货地址（选填）</label><textarea id="fAddr" placeholder="省市区 + 详细地址 + 收件人"></textarea>
  <button class="sub" onclick="doSubmit()">生成选款单</button>
  <button class="can" onclick="closeD()">取消</button>
</div>
<div class="ok" id="ok">
  <div class="ic">✓</div><h2>选款单已生成</h2>
  <p>复制选款单 → 打开微信 → 找到店主（<b id="wxName"></b>）→ 粘贴发送。</p>
  <button class="copy" onclick="copyIt()">复制选款单</button>
  <a class="copy" style="display:block;margin-top:10px;text-decoration:none;" href="weixin://" onclick="if(!confirm('将尝试打开微信，请在聊天窗口粘贴选款单发给店主'))event.preventDefault();">打开微信粘贴发送</a>
  <div class="box" id="box"></div>
  <button class="back" onclick="location.reload()">继续看别的款式</button>
</div>
<script>
const GOODS = [{"name":"粉晶手串 · 温柔款","spec":"8mm 粉晶 + 925银隔珠","price":99,"img":[]},{"name":"白水晶手串 · 经典款","spec":"10mm 白水晶 + 弹力绳","price":88,"img":[]},{"name":"淡水珍珠手串 · 小仙女款","spec":"6-7mm 近圆珍珠","price":129,"img":[]},{"name":"紫水晶手串 · 招财款","spec":"8mm 紫水晶 + 转运珠","price":118,"img":[]},{"name":"马贝珍珠手串 · 轻奢款","spec":"10-11mm 马贝珍珠","price":168,"img":[]},{"name":"定制手串","spec":"手围 / 珠径 / 配色均可定制","price":0,"img":[]}];
const WX = 'lelezhubao';
// 兼容旧数据：img 是字符串时转成数组
GOODS.forEach(function(g){
  if(typeof g.img === 'string'){ g.img = g.img ? [g.img] : []; }
  if(!Array.isArray(g.img)){ g.img = []; }
});
let cur = null;
let gIdx = 0;
function render(){
  const g = document.getElementById('grid');
  g.innerHTML = '';
  GOODS.forEach((x,i)=>{
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = '<div class="img-wrap" '+(x.img&&x.img[0]?'style="background:url(\''+x.img[0]+'\') center/cover no-repeat"':'')+'><div class="img-num">共'+(x.img&&x.img.length?x.img.length:0)+'张</div></div><div class="info"><div class="name">'+x.name+'</div><div class="spec">'+x.spec+'</div><div class="price-row"><div class="price">'+(x.price?'¥'+x.price:'价格待定')+'</div><button class="btn" onclick="openD('+i+')">选这款</button></div></div>';
    g.appendChild(c);
  });
}
function openD(i){
  cur = GOODS[i];
  document.getElementById('dName').textContent = cur.name;
  document.getElementById('dSpec').textContent = cur.spec;
  document.getElementById('dPrice').textContent = cur.price ? '¥'+cur.price : '价格待定';
  gIdx = 0; gShow();
  document.getElementById('mask').style.display='block';
  document.getElementById('drawer').style.display='block';
}
function closeD(){
  document.getElementById('mask').style.display='none';
  document.getElementById('drawer').style.display='none';
}
function gShow(){
  const imgs = cur.img || [];
  const g = document.getElementById('gallery');
  if(!imgs.length){ g.style.display='none'; return; }
  g.style.display='block';
  document.getElementById('gMain').style.backgroundImage = "url('"+imgs[gIdx]+"')";
  const dots = document.getElementById('gDots');
  dots.innerHTML = '';
  imgs.forEach(function(_,i){
    const s = document.createElement('span');
    if(i === gIdx) s.className = 'on';
    s.onclick = function(){ gIdx = i; gShow(); };
    dots.appendChild(s);
  });
  document.getElementById('gCount').textContent = (gIdx+1)+' / '+imgs.length;
}
function gPrev(){
  const n = (cur.img||[]).length; if(!n) return;
  gIdx--; if(gIdx < 0) gIdx = n-1; gShow();
}
function gNext(){
  const n = (cur.img||[]).length; if(!n) return;
  gIdx++; if(gIdx >= n) gIdx = 0; gShow();
}
function doSubmit(){
  const c = document.getElementById('fContact').value.trim();
  if(!c){ alert('请填微信号或手机号'); return; }
  const sp = document.getElementById('fSpec').value.trim() || '默认规格';
  const ad = document.getElementById('fAddr').value.trim();
  const lines = ['【选款单】','款式：'+cur.name,'规格：'+sp,'价格：'+(cur.price?'¥'+cur.price:'价格待定'),'联系方式：'+c];
  if(ad) lines.push('收货地址：'+ad); else lines.push('收货地址：未留（私聊转账时再补）');
  lines.push('—','请店主联系我，谢谢');
  document.getElementById('box').textContent = lines.join('\n');
  closeD();
  document.getElementById('ok').style.display='block';
}
function copyIt(){
  const t = document.getElementById('box').textContent;
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>{ alert('已复制，去粘贴给店主吧'); }); }
  else { const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert('已复制，去粘贴给店主吧'); }
}
document.getElementById('mask').addEventListener('click', closeD);
document.getElementById('wxName').textContent = WX;
render();
</script>
</body>
</html>
